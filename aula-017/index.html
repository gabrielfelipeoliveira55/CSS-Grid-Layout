  <body>

    <!-- ? header -->
    <header class="header">

      <div class="container-logo">

        <div class="logo"><a href="./index.html">gfor</a></div>

      </div>

      <div class="container-title">

        <h1 class="title">Learning to use the <span class="accent" title="Define a área do item do grid. É um atalho para grid-row-start, grid-column-start, grid-row-end, grid-column-end. O z-index pode ser utilizado para manipular a posição no eixo Z do item. Ou seja, se um item for posicionado em cima de outro, o z-index controla qual vêm na frente.">grid-area</span>.</h1>

      </div>
      
      <div class="icon-container">

        <div class="icon-container-box">

          <img src="./assets/icons/grid-icon-bento.svg" alt="Icone Grid">
          
        </div>

      </div>

    </header>

    <!-- ? main -->
    <main class="main">

      <!-- ? section 1 -->
      <section class="section">

        <h2 class="title-section">grid-area: 1 / 2 / 4 / 3;</h2>

        <div class="grid grid-area-1">
      
          <div class="item item-1">1</div>
          <div class="item item-2">2</div>
          <div class="item item-3">3</div>
          <div class="item item-4">4</div>
          <div class="item item-5">5</div>
          <div class="item item-6">6</div>
      
        </div>
      
      </section>

      <!-- ? section 2 -->
      <section class="section">

        <h2 class="title-section">grid-area: header;</h2>

        <div class="grid grid-area-2">
      
          <div class="item item-1">1</div>
          <div class="item item-2">2</div>
          <div class="item item-3">3</div>
          <div class="item item-4">4</div>
          <div class="item item-5">5</div>
          <div class="item item-6">6</div>
      
        </div>
      
      </section>

            <!-- ? section 2 -->

        <h2 class="title-section">grid-area</h2>

          <div class="item item-2">2</div>
          <div class="item item-3">3</div>

          <div class="item item-14">14</div>
          <div class="item item-15">15</div>
          <div class="item item-16">16</div>
          <div class="item item-17">17</div>
          <div class="item item-18">18</div>
          <div class="item item-19">19</div>
          <div class="item item-20">20</div>
      
        </div>
      
      </section>
