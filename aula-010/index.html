<!DOCTYPE html>
<html lang="pt-br">

  <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learnig CSS Grid Layout (grid)">
    <meta name="robots" content="noindex, nofollow" />
    <meta name="author" content="Gabriel Felipe de Oliveira Rateiro">

    <!-- ? Link for Font IBM Plex Mono: [400] - [500] - [600] - [700] -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ? Link for Font Nunito All -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <!-- ? Link for stylesheet -->
    <link rel="stylesheet" href="./components/css/style.css">

    <title>CSS Grid Layout [grid]</title>

  </head>

  <body>

    <!-- ? header -->
    <header class="header">

      <div class="container-logo">

        <div class="logo"><a href="./index.html">gfor</a></div>

      </div>

      <div class="container-title">

        <h1 class="title">Learning to use the <span class="accent" title="Atalho geral para definir o grid: grid-template-rows, grid-template-columns, grid-template-areas, grid-auto-rows, grid-auto-columns e grid-auto-flow">grid</span>.</h1>

      </div>
      
      <div class="icon-container">

        <div class="icon-container-box">

          <img src="./assets/icons/grid-icon-bento.svg" alt="Icone Grid">
          
        </div>

      </div>

    </header>

    <!-- ? main -->
    <main class="main">

      <!-- ? section 1 -->
      <section class="section">

        <h2 class="title-section">grid: 100px / 1fr 1fr;</h2>

        <div class="grid grid-1">
      
          <div class="item">1</div>
          <div class="item">2</div>
          <div class="item">3</div>
          <div class="item">4</div>
          <div class="item">5</div>
      
        </div>
      
      </section>

      <!-- ? section 2 -->
      <section class="section">

        <h2 class="title-section">grid: 100px / auto-flow 100px 50px;</h2>

        <div class="grid grid-2">
      
          <div class="item">1</div>
          <div class="item">2</div>
          <div class="item">3</div>
          <div class="item">4</div>
          <div class="item">5</div>
      
        </div>
      
      </section>

      <!-- ? section 3 -->
      <section class="section">

        <h2 class="title-section">grid diversos valores</h2>
      
        <div class="grid grid-3">
      
          <div class="item logo">logo</div>
          <div class="item nav">nav</div>
          <div class="item content">content</div>
          <div class="item sidenav">sidenav</div>
          <div class="item advert">advert</div>
          <div class="item footer">footer</div>

      
        </div>
      
      </section>

    </main>

    <!-- ? footer -->
    <footer class="container-footer">

      <p class="copyright"> Todos os direitos reservados a <a href="https://github.com/gabrielfelipeoliveira55" target="_blank" class="accent link-github" >Gabriel Felipe de Oliveira Rateiro</a> | <strong class="accent">&copy;</strong> 2026.</>

    </footer>
    
  </body>

</html>
