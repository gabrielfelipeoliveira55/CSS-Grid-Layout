<!DOCTYPE html>
<html lang="pt-br">

  <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learnig CSS Grid Layout (justify-items)">
    <meta name="robots" content="noindex, nofollow" />
    <meta name="author" content="Gabriel Felipe de Oliveira Rateiro">

    <!-- ? Link for Font IBM Plex Mono: [400] - [500] - [600] - [700] -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ? Link for Font Nunito All -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <!-- ? Link for stylesheet -->
    <link rel="stylesheet" href="./components/css/style.css">

    <title>CSS Grid Layout [justify-items]</title>

  </head>

  <body>

    <!-- ? header -->
    <header class="header">

      <div class="container-logo">

        <div class="logo"><a href="./index.html">gfor</a></div>

      </div>

      <div class="container-title">

        <h1 class="title">Learning to use the <span class="accent" title="Justifica o conteúdo dos itens do grid em relação ao eixo x (horizontal). Justifica em relação a célula.">justify-items</span>.</h1>

      </div>
      
      <div class="icon-container">

        <div class="icon-container-box">

          <img src="./assets/icons/grid-icon-bento.svg" alt="Icone Grid">
          
        </div>

      </div>

    </header>

    <!-- ? main -->
    <main class="main">

      <!-- ? section 1 -->
      <section class="section">

        <h2 class="title-section">justify-items: start;</h2>

        <div class="grid start">
      
          <div class="item">1</div>
          <div class="item item-2">2</div>
          <div class="item item-3">3</div>
          <div class="item">4</div>
          <div class="item item-5">5</div>
          <div class="item">6</div>

      
        </div>
      
      </section>

      <!-- ? section 2 -->
      <section class="section">

        <h2 class="title-section">justify-items: end;</h2>

        <div class="grid end">
      
          <div class="item">1</div>
          <div class="item item-2">2</div>
          <div class="item item-3">3</div>
          <div class="item">4</div>
          <div class="item item-5">5</div>
          <div class="item">6</div>

      
        </div>
      
      </section>

      <!-- ? section 3 -->
      <section class="section">

        <h2 class="title-section">justify-items: center;</h2>

        <div class="grid center">
      
          <div class="item">1</div>
          <div class="item item-2">2</div>
          <div class="item item-3">3</div>
          <div class="item">4</div>
          <div class="item item-5">5</div>
          <div class="item">6</div>

      
        </div>
      
      </section>

      <!-- ? section 4 -->
      <section class="section">

        <h2 class="title-section">justify-items: stretch;</h2>

        <div class="grid stretch">
      
          <div class="item">1</div>
          <div class="item item-2">2</div>
          <div class="item item-3">3</div>
          <div class="item">4</div>
          <div class="item item-5">5</div>
          <div class="item">6</div>

      
        </div>
      
      </section>

    </main>

    <!-- ? footer -->
    <footer class="container-footer">

      <p class="copyright"> Todos os direitos reservados a <a href="https://github.com/gabrielfelipeoliveira55" target="_blank" class="accent link-github" >Gabriel Felipe de Oliveira Rateiro</a> | <strong class="accent">&copy;</strong> 2026.</>

    </footer>
    
  </body>

</html>
